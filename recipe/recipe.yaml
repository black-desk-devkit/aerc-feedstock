context:
  version: "0.22.0"

package:
  name: aerc
  version: ${{ version }}

source:
  - url: https://git.sr.ht/~rjarry/aerc/archive/${{ version }}.tar.gz
    sha256: f1cd5e358fd836051d4d88c189ecaa025a108b729281985525b45b13bc49e70f

build:
  number: 0
  skip:
    - win
  dynamic_linking:
    overlinking_behavior: error
    overdepending_behavior: error
  script:
    - export CGO_ENABLED=1
    - export CGO_CFLAGS="-I$PREFIX/include"
    - export CGO_LDFLAGS="-L$PREFIX/lib"
    - >-
      make VERSION=${{ version }} SHAREDIR=/usr/local/share/aerc
      LIBEXECDIR=/usr/local/libexec/aerc GOFLAGS="-tags=notmuch"
      BUILD_OPTS="-buildmode=pie -trimpath" GO_EXTRA_LDFLAGS="-s -w"
    - make install PREFIX="$PREFIX" GOFLAGS="-tags=notmuch"
    - GOFLAGS="-tags=notmuch" go-licenses save . --save_path=license-files
    # Clear out cache to avoid file not removable warnings
    - if: unix
      then: chmod -R u+w $(go env GOPATH) && rm -rf $(go env GOPATH)

requirements:
  build:
    - go >=1.25
    - ${{ compiler("c") }}
    - go-licenses
    - make
    - scdoc
  host:
    - notmuch
  run:
    - notmuch

tests:
  - package_contents:
      files:
        - share/aerc/aerc.conf
        - share/aerc/stylesets/default
        - share/man/man1/aerc.1
        - libexec/aerc/filters/calendar
      bin:
        - aerc
  - script:
      - aerc -h
      - aerc -v | grep '+notmuch-'

about:
  homepage: https://aerc-mail.org/
  summary: aerc is an email client for your terminal
  description: |
    aerc is an email client for your terminal.

    This is a fork of the original aerc by Drew DeVault.

    A short demonstration can be found on https://aerc-mail.org/

    Join the IRC channel: #aerc on irc.libera.chat for end-user support, and development.
  license: MIT
  license_file:
    - LICENSE
    - license-files/
  documentation: https://man.sr.ht/~rjarry/aerc/
  repository: https://git.sr.ht/~rjarry/aerc

extra:
  recipe-maintainers:
    - black-desk
